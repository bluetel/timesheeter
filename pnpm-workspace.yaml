packages:
  - 'packages/*'
# pnpm 10+ skips dependency build scripts by default; pnpm 12 requires each to be listed.
# Prisma client/engines are generated by packages/web's install script instead.
allowBuilds:
  '@prisma/client': false
  '@prisma/engines': false
  aws-crt: false
  aws-sdk: false
  esbuild: false
  fast-folder-size: false
  prisma: false
